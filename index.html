<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | NFT preview card component</title>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <div class="card">
        <div class="image-container">
          <img
            src="./images/image-equilibrium.jpg"
            alt=" Equilibrium"
            class="image"
          />
          <div>
            <img src="./images/icon-view.svg" alt="eye icon" />
          </div>
        </div>
        <h1>
          <a href="https://www.frontendmentor.io/profile/QS3H" target="_blank"
            >Equilibrium #3429</a
          >
        </h1>
        <p class="text">
          Our Equilibrium collection promotes <br />balance and calm.
        </p>
        <ul>
          <li>
            <img
              src="./images/icon-ethereum.svg"
              alt="ethereum icon"
              class="icon"
            />
            0.041 ETH
          </li>
          <li>
            <img src="./images/icon-clock.svg" alt="clock icon" class="icon" />
            3 days left
          </li>
        </ul>
        <div class="avatar-container">
          <img
            src="./images/image-avatar.png"
            alt="image creator"
            class="avatar"
          />
          <p>Creation of <span>Jules Wyvern</span></p>
        </div>
      </div>
    </main>
  </body>
</html>
